---
name: Build collection

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  build-sap-cluster_qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Run collection build command
        run: make build
